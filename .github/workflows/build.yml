name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test sync client & Windows hotkey
        shell: pwsh
        run: |
          cd sync
          go test ./...
          cd ..\windows\app
          go test ./...
      - name: Build Windows installer
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: YiQi-Windows-Setup.exe
          path: dist/YiQi-Windows-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config librime-dev librime-plugin-lua rsync dpkg-dev
      - name: Test sync client, Linux hotkey & Rime switch
        run: |
          (cd sync && go test ./...)
          (cd linux/app && go test ./...)
      - name: Build Linux packages
        run: ./linux/build.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: YiQi-Linux-x86_64
          path: |
            dist/YiQi-Linux-x86_64.tar.gz
            dist/YiQi-Linux-amd64.deb

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen librime
      - name: Build & test iOS
        run: ./ios/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: YiQi-iOS.ipa
          path: dist/YiQi-iOS.ipa

  release:
    needs: [windows, linux, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" --title "一炁输入法 $TAG" --generate-notes artifacts/*
          fi
