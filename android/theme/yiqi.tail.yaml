preset_keyboards:
  default:
    name: 一炁 26 键
    ascii_mode: 0
    width: 10
    height: 40
    keys:
    - {click: q, label: Q, long_click: '1'}
    - {click: w, label: W, long_click: '2'}
    - {click: e, label: E, long_click: '3'}
    - {click: r, label: R, long_click: '4'}
    - {click: t, label: T, long_click: '5'}
    - {click: y, label: Y, long_click: '6'}
    - {click: u, label: U, long_click: '7'}
    - {click: i, label: I, long_click: '8'}
    - {click: o, label: O, long_click: '9'}
    - {click: p, label: P, long_click: '0'}
    - {width: 5}
    - {click: a, label: A, long_click: '-'}
    - {click: s, label: S, long_click: '/'}
    - {click: d, label: D, long_click: ':'}
    - {click: f, label: F, long_click: ';'}
    - {click: g, label: G, long_click: '('}
    - {click: h, label: H, long_click: ')'}
    - {click: j, label: J, long_click: '~'}
    - {click: k, label: K, long_click: '“'}
    - {click: l, label: L, long_click: '”'}
    - {width: 5}
    - {click: Qi_shift, width: 13.5, key_back_color: fn_back, key_text_color: fn_text}
    - {width: 1.5}
    - {click: z, label: Z, long_click: '@'}
    - {click: x, label: X, long_click: '.'}
    - {click: c, label: C, long_click: '#'}
    - {click: v, label: V, long_click: '、'}
    - {click: b, label: B, long_click: '?'}
    - {click: n, label: N, long_click: '!'}
    - {click: m, label: M, long_click: '…'}
    - {width: 1.5}
    - {click: Qi_backspace, width: 13.5, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Qi_symbols, width: 11, key_text_size: 16, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Qi_number, width: 11, key_text_size: 15, key_back_color: fn_back, key_text_color: fn_text}
    - {click: ',', label: '，', width: 10}
    - {click: space, width: 32}
    - {click: '.', label: '。', width: 10}
    - {click: Qi_lang, width: 10, key_text_size: 16, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Return, width: 16, key_text_size: 16, key_back_color: accent_back, key_text_color: accent_text}

  number:
    name: 一炁数字
    ascii_mode: 1
    width: 20
    height: 40
    keys:
    - {click: '+', width: 16, key_back_color: fn_back, key_text_color: fn_text}
    - {click: '1', width: 22.6}
    - {click: '2', width: 22.6}
    - {click: '3', width: 22.6}
    - {click: Qi_backspace, width: 16.2, key_back_color: fn_back, key_text_color: fn_text}
    - {click: '-', width: 16, key_back_color: fn_back, key_text_color: fn_text}
    - {click: '4', width: 22.6}
    - {click: '5', width: 22.6}
    - {click: '6', width: 22.6}
    - {click: '.', width: 16.2, key_back_color: fn_back, key_text_color: fn_text}
    - {click: '*', width: 16, key_back_color: fn_back, key_text_color: fn_text}
    - {click: '7', width: 22.6}
    - {click: '8', width: 22.6}
    - {click: '9', width: 22.6}
    - {click: '@', width: 16.2, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Qi_back, width: 16, key_back_color: fn_back, key_text_color: fn_text}
    - {click: ',', width: 22.6}
    - {click: '0', width: 22.6}
    - {click: Qi_space, width: 22.6}
    - {click: Return, width: 16.2, key_back_color: accent_back, key_text_color: accent_text}

  symbols:
    name: 一炁符号
    ascii_mode: 0
    width: 10
    height: 40
    keys:
    - {click: '，', ascii: ','}
    - {click: '。', ascii: '.'}
    - {click: '？', ascii: '?'}
    - {click: '！', ascii: '!'}
    - {click: '、'}
    - {click: '：', ascii: ':'}
    - {click: '；', ascii: ';'}
    - {click: '“'}
    - {click: '”'}
    - {click: '…'}
    - {click: '（', ascii: '('}
    - {click: '）', ascii: ')'}
    - {click: '《'}
    - {click: '》'}
    - {click: '【'}
    - {click: '】'}
    - {click: '「'}
    - {click: '」'}
    - {click: '～', ascii: '~'}
    - {click: '·'}
    - {click: '@'}
    - {click: '#'}
    - {click: '%'}
    - {click: '&'}
    - {click: '*'}
    - {click: '-'}
    - {click: '+'}
    - {click: '='}
    - {click: '/'}
    - {click: '￥'}
    - {click: Qi_back, width: 15, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Qi_number, width: 15, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Qi_space, width: 40}
    - {click: Qi_backspace, width: 15, key_back_color: fn_back, key_text_color: fn_text}
    - {click: Return, width: 15, key_back_color: accent_back, key_text_color: accent_text}

tool_bar:
  button_spacing: 2
  primary_button:
    size: [42, 42]
    background: {type: circle, normal: 0x00000000, highlight: hilited_key_back_color, vertical_inset: 4, horizontal_inset: 4}
    foreground: {style: "ic@cog_outline", normal: candidate_text_color, padding: 10, font_size: 16}
    action: Settings
  buttons:
    - {size: [42, 42], background: {type: circle, normal: 0x00000000, highlight: hilited_key_back_color, vertical_inset: 4, horizontal_inset: 4}, foreground: {style: "ic@chevron_down", normal: candidate_text_color, padding: 9, font_size: 18}, action: Hide}
    - {size: [42, 42], background: {type: circle, normal: 0x00000000, highlight: hilited_key_back_color, vertical_inset: 4, horizontal_inset: 4}, foreground: {option_styles: ["badge@全", "badge@双"], normal: candidate_text_color, padding: 10}, action: Qi_scheme}
    - {size: [42, 42], background: {type: circle, normal: 0x00000000, highlight: hilited_key_back_color, vertical_inset: 4, horizontal_inset: 4}, foreground: {style: "ic@clipboard_outline", normal: candidate_text_color, padding: 10, font_size: 16}, action: clipboard_window}
    - {size: [42, 42], background: {type: circle, normal: 0x00000000, highlight: hilited_key_back_color, vertical_inset: 4, horizontal_inset: 4}, foreground: {style: "ic@emoticon_outline", normal: candidate_text_color, padding: 10, font_size: 16}, action: Qi_emoji}
