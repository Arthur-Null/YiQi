config_version: "3.0"
name: 一炁
author: YiQi

style:
  auto_caps: false
  candidate_padding: 10
  candidate_spacing: 0.0
  candidate_text_size: 20
  candidate_view_height: 36
  candidate_corner_radius: 6
  comment_height: 12
  comment_position: right
  comment_text_size: 12
  horizontal_gap: 6
  vertical_gap: 8
  keyboard_padding: 4
  keyboard_padding_bottom: 4
  keyboard_padding_land: 60
  key_height: 40
  key_long_text_size: 16
  key_text_size: 20
  key_width: 10.0
  label_text_size: 16
  symbol_text_size: 9
  round_corner: 6
  shadow_radius: 0.0
  key_border: 0
  key_text_offset_y: 3
  key_symbol_offset_y: -1
  key_press_offset_x: 0
  key_press_offset_y: 0
  keyboard_height: 206
  keyboard_height_land: 190
  popup_text_size: 26
  reset_ascii_mode_on_focus_change: false
  enter_label_mode: 3
  enter_labels:
    go: 前往
    done: 完成
    next: 下一步
    pre: 上一步
    search: 搜索
    send: 发送
    default: 换行

preedit:
  horizontal_padding: 10
  top_start_radius: 8
  top_end_radius: 8
  foreground:
    font_size: 15

window:
  insets:
    vertical: 4
    horizontal: 6
  item_padding:
    horizontal: 6
  corner_radius: 8
  foreground:
    label_font_size: 16
    text_font_size: 18
    comment_font_size: 14

fallback_colors:
  candidate_text_color: text_color
  liquid_key_back_color: key_back_color

preset_color_schemes:
  default:
    name: 一炁浅色
    dark_scheme: dark
    back_color: 0xEDEEF2
    keyboard_back_color: 0xEDEEF2
